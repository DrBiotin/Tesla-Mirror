<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tesla Mirror</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.88);z-index:2}
  #ov.hide{display:none}
  #go{font-size:30px;padding:20px 56px;border:0;border-radius:16px;background:#e82127;color:#fff;cursor:pointer}
  #msg{font-size:18px;opacity:.75;text-align:center;max-width:80vw}
  #st{position:fixed;left:14px;bottom:12px;font-size:14px;opacity:.55;z-index:3;pointer-events:none}
  #fs{position:fixed;right:14px;top:12px;z-index:3;font-size:16px;padding:8px 14px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;opacity:.5}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<audio id="a"></audio>
<button id="fs">⛶</button>
<div id="ov">
  <button id="go"></button>
  <div id="msg"></div>
</div>
<div id="st"></div>
<script>
(() => {
  'use strict';
  // Video and audio play in separate elements: a still screen (no new video frames)
  // must not stall the sound. Audio is the master clock; video follows it.
  const v = document.getElementById('v');
  const au = document.getElementById('a');
  const ov = document.getElementById('ov');
  const msg = document.getElementById('msg');
  const st = document.getElementById('st');
  const LIVE_TARGET = 0.12, MAX_LAG = 0.8;
  let ws = null, tracks = null, gen = 0, started = false, fatal = false;

  // Texts follow the phone app's language (initial value injected by the server, live updates via WebSocket).
  const L = {
    tr: { start: '▶ Başlat', msg: 'Telefonda TeslaMirror yayını açık olmalı. Ses için bu düğmeye dokunmak gerekir.', noMse: 'Bu tarayıcı MediaSource desteklemiyor.', connecting: 'Bağlanıyor…', lost: 'Bağlantı koptu, yeniden deneniyor…', unsupported: 'Bu tarayıcı yayın biçimini desteklemiyor: ', noAudio: 'Ses yok (telefonda ses izni verilmedi)', playErr: 'Oynatma hatası, yeniden bağlanılıyor…', fullscreen: 'Tam ekran' },
    en: { start: '▶ Start', msg: 'TeslaMirror must be streaming on the phone. Tap this button to enable sound.', noMse: 'This browser does not support MediaSource.', connecting: 'Connecting…', lost: 'Connection lost, retrying…', unsupported: 'This browser does not support the stream format: ', noAudio: 'No audio (audio permission not granted on the phone)', playErr: 'Playback error, reconnecting…', fullscreen: 'Full screen' },
    de: { start: '▶ Start', msg: 'TeslaMirror muss auf dem Telefon übertragen. Tippen Sie auf diese Schaltfläche, um den Ton zu aktivieren.', noMse: 'Dieser Browser unterstützt MediaSource nicht.', connecting: 'Verbinde…', lost: 'Verbindung unterbrochen, neuer Versuch…', unsupported: 'Dieser Browser unterstützt das Streamformat nicht: ', noAudio: 'Kein Ton (Audio-Berechtigung auf dem Telefon nicht erteilt)', playErr: 'Wiedergabefehler, verbinde neu…', fullscreen: 'Vollbild' },
    fr: { start: '▶ Démarrer', msg: 'TeslaMirror doit diffuser sur le téléphone. Appuyez sur ce bouton pour activer le son.', noMse: 'Ce navigateur ne prend pas en charge MediaSource.', connecting: 'Connexion…', lost: 'Connexion perdue, nouvelle tentative…', unsupported: 'Ce navigateur ne prend pas en charge le format du flux : ', noAudio: 'Pas de son (autorisation audio non accordée sur le téléphone)', playErr: 'Erreur de lecture, reconnexion…', fullscreen: 'Plein écran' },
    es: { start: '▶ Iniciar', msg: 'TeslaMirror debe estar transmitiendo en el teléfono. Pulse este botón para activar el sonido.', noMse: 'Este navegador no es compatible con MediaSource.', connecting: 'Conectando…', lost: 'Conexión perdida, reintentando…', unsupported: 'Este navegador no admite el formato de la transmisión: ', noAudio: 'Sin audio (no se concedió el permiso de audio en el teléfono)', playErr: 'Error de reproducción, reconectando…', fullscreen: 'Pantalla completa' },
    ar: { start: '▶ ابدأ', msg: 'يجب أن يكون TeslaMirror يبث على الهاتف. اضغط على هذا الزر لتفعيل الصوت.', noMse: 'هذا المتصفح لا يدعم MediaSource.', connecting: 'جارٍ الاتصال…', lost: 'انقطع الاتصال، جارٍ إعادة المحاولة…', unsupported: 'هذا المتصفح لا يدعم تنسيق البث: ', noAudio: 'لا يوجد صوت (لم يُمنح إذن الصوت على الهاتف)', playErr: 'خطأ في التشغيل، جارٍ إعادة الاتصال…', fullscreen: 'ملء الشاشة' },
  };
  let lang = L[document.documentElement.lang] ? document.documentElement.lang : 'en';
  let stKey = '', stExtra = '';
  const tr = (k) => (L[lang] && L[lang][k]) || L.en[k] || '';
  const status = (k, extra) => { stKey = k || ''; stExtra = extra || ''; st.textContent = stKey ? tr(stKey) + stExtra : ''; };
  function applyLang(code) {
    if (L[code]) lang = code;
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('go').textContent = tr('start');
    if (!msg.dataset.err) msg.textContent = tr('msg');
    document.getElementById('fs').title = tr('fullscreen');
    st.textContent = stKey ? tr(stKey) + stExtra : '';
  }
  applyLang(lang);

  function makeTrack(el, mime, myGen) {
    const t = { el, sb: null, q: [], ms: new MediaSource() };
    const url = URL.createObjectURL(t.ms);
    el.src = url;
    t.ms.addEventListener('sourceopen', () => {
      URL.revokeObjectURL(url);
      if (myGen !== gen) return;
      try {
        t.sb = t.ms.addSourceBuffer(mime);
      } catch (e) {
        fatal = true;
        tracks = null;
        status('unsupported', mime);
        try { ws.close(); } catch (_) {}
        return;
      }
      t.sb.addEventListener('updateend', () => pump(t));
      pump(t);
    }, { once: true });
    return t;
  }

  function build(cfg) {
    const myGen = ++gen;
    tracks = {
      v: makeTrack(v, 'video/mp4; codecs="' + cfg.v + '"', myGen),
      a: cfg.a ? makeTrack(au, 'audio/mp4; codecs="' + cfg.a + '"', myGen) : null,
    };
    if (!cfg.a) { au.removeAttribute('src'); au.load(); }
    status(cfg.a ? '' : 'noAudio');
  }

  function isCurrent(t) { return tracks && (t === tracks.v || t === tracks.a); }

  function pump(t) {
    if (!isCurrent(t) || !t.sb || t.sb.updating || !t.q.length || t.ms.readyState !== 'open') return;
    try {
      t.sb.appendBuffer(t.q[0]);
      t.q.shift();                       // only after a successful append
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        if (!trimTrack(t, 1)) t.q.length = 0;   // nothing removable: drop backlog
      } else {
        // Decoder/buffer got into a bad state: reconnect, the server resends config + keyframe.
        status('playErr');
        tracks = null;
        try { ws.close(); } catch (_) {}
      }
    }
  }

  function trimTrack(t, keepSec) {
    const upto = t.el.currentTime - keepSec;
    if (!t.sb || t.sb.updating || upto <= 0 || !t.sb.buffered.length || t.sb.buffered.start(0) >= upto) return false;
    try { t.sb.remove(0, upto); return true; } catch (_) { return false; }
  }

  function connect() {
    if (fatal) return;
    status('connecting');
    ws = new WebSocket('ws://' + location.host + '/ws');
    ws.binaryType = 'arraybuffer';
    ws.onmessage = (e) => {
      if (typeof e.data === 'string') {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (m.type === 'config') build(m);
        else if (m.type === 'lang') applyLang(m.lang);
        return;
      }
      if (!tracks) return;
      const d = new Uint8Array(e.data);
      const k = d[0];
      const t = (k === 1 || k === 2) ? tracks.v : (k === 3 || k === 4) ? tracks.a : null;
      if (!t) return;
      t.q.push(d.subarray(1));
      if (t.q.length > 600) t.q.length = 0; // runaway safety (e.g. MediaSource never opened)
      pump(t);
    };
    ws.onclose = () => {
      tracks = null;
      if (fatal) return;
      status('lost');
      setTimeout(connect, 1500);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }

  function lastRange(r) { return r.length ? [r.start(r.length - 1), r.end(r.length - 1)] : null; }
  function inRanges(r, x) { for (let i = 0; i < r.length; i++) if (x >= r.start(i) && x <= r.end(i)) return true; return false; }

  // Master element stays close to the live edge.
  function chase(el) {
    const lr = lastRange(el.buffered);
    if (!lr) return;
    const [start, end] = lr;
    const lag = end - el.currentTime;
    if (el.currentTime < start || lag > MAX_LAG) el.currentTime = Math.max(start, end - LIVE_TARGET);
    else el.playbackRate = lag > 0.3 ? 1.08 : 1.0;
    if (el.paused && end - start > 0.05) el.play().catch(() => {});
  }

  // Video follows the audio clock; on a still screen it just holds the last frame.
  function follow(target) {
    const r = v.buffered, lr = lastRange(r);
    if (!lr) return;
    const [start, end] = lr;
    if (target < start) {                      // video is ahead of the sound: hold on its first frame
      if (v.currentTime !== start) v.currentTime = start;
      if (!v.paused) v.pause();
      return;
    }
    if (inRanges(r, target)) {
      const diff = target - v.currentTime;     // >0: video behind audio
      if (Math.abs(diff) > 0.15) { v.currentTime = target; v.playbackRate = au.playbackRate; }
      else if (Math.abs(diff) > 0.03) v.playbackRate = au.playbackRate * (diff > 0 ? 1.1 : 0.9);
      else v.playbackRate = au.playbackRate;
    } else if (target > end) {                 // still screen: keep showing the last frame
      if (v.currentTime < end - 0.05) v.currentTime = Math.max(start, end - 0.01);
    }
    if (v.paused) v.play().catch(() => {});
  }

  setInterval(() => {
    if (!tracks || !tracks.v.sb) return;
    if (tracks.a && tracks.a.sb) {
      chase(au);
      follow(au.currentTime);
      trimTrack(tracks.a, 10);
    } else {
      chase(v);
    }
    trimTrack(tracks.v, 10);
  }, 250);

  function fullscreen() {
    const el = document.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) { try { const p = f.call(el); if (p && p.catch) p.catch(() => {}); } catch (_) {} }
  }

  document.getElementById('go').onclick = () => {
    if (!window.MediaSource) { msg.dataset.err = '1'; msg.textContent = tr('noMse'); return; }
    ov.classList.add('hide');
    au.muted = false;
    au.play().catch(() => {});   // unlock audio inside the user gesture
    fullscreen();
    if (!started) { started = true; connect(); }
  };
  document.getElementById('fs').onclick = fullscreen;
})();
</script>
</body>
</html>
